; Calibración automática ICS-43434 (I2S) — XIAO ESP32-S3
; Realiza una calibración completa y automática del nodo digital:
;   1. Resetea el offset en NVM
;   2. Mide con calibrador a 94 dB
;   3. Determina si el micrófono es válido o falso
;   4. Calcula y guarda el offset óptimo en NVM
;   5. Verifica la calibración
;
; Uso: acoplar calibrador de 94 dB, compilar, flashear y abrir Monitor Serie.
; El proceso es 100% automático.

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    ; Driver I2S heredado: obsoleto en core 3.x / IDF 5 (avisos, no errores).
    -D CONFIG_I2S_SUPPRESS_DEPRECATE_WARN=1
    -Wno-deprecated-declarations
    ; Debe coincidir con el entorno S3 del firmware principal
    -D SAMPLE_RATE=48000
    ; Nivel del calibrador (por defecto 94 dB)
    ; -D CALIBRATOR_DB=104.0

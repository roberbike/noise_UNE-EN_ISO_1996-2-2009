; Firmware de calibración para el nodo analógico (ESP32-C3 + MAX4466).
; Misma cadena de medida que src/main.cpp: ADC a 16 kHz + ponderación A + RMS.
; Uso: flashear en el nodo, Monitor Serie a 115200, calibrador de 94 dB y
; anotar el RMS (mV) estable. Ver README.md y docs/CALIBRACION.md.
[env:lolin_c3_mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; build_flags =
;     ; Las mismas constantes que el firmware principal, solo para que el
;     ; LAeq que se muestra use la calibración vigente:
;     -D CALIBRATION_RMS_MV=166.0
;     ; Borra en el arranque el offset por unidad guardado en NVS
;     ; (CMD_SET_CALIB); hazlo al estrenar un CALIBRATION_RMS_MV nuevo:
;     -D RESET_NVS_CALIB
;     ; Solo si el firmware principal se compila también con él:
;     -D A_WEIGHT_LEGACY_16K
lib_deps =

; Firmware de calibración para el nodo digital (XIAO ESP32-S3 + ICS-43434).
; Misma conversión que src/main_i2s.cpp, sin ningún trim. Ver README.md.
[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    ; Driver I2S heredado: obsoleto en core 3.x / IDF 5 (avisos, no errores).
    -D CONFIG_I2S_SUPPRESS_DEPRECATE_WARN=1
    -Wno-deprecated-declarations
    ; Debe coincidir con el entorno S3 del firmware principal: los
    ; coeficientes de ponderación A se seleccionan por este valor, y medir a
    ; otro rate cambia tanto la ponderación como el aliasado.
    -D SAMPLE_RATE=48000
    ; Nivel al que está puesto el calibrador (por defecto 94). 104 sirve para
    ; comprobar la linealidad; 114 satura las unidades de este proyecto.
    ; -D CALIBRATOR_DB=104.0
    ; Trim con el que está compilado el firmware principal, solo para mostrar
    ; la diferencia de esta unidad (por defecto -13.71).
    ; -D FIRMWARE_MIC_OFFSET_DB=-13.71
    ; Borra en el arranque el offset por unidad guardado en NVS (CMD_SET_CALIB).
    ; -D RESET_NVS_CALIB

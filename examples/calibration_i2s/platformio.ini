[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    ; Debe coincidir con el entorno S3 del firmware principal: los
    ; coeficientes de ponderacion A se seleccionan por este valor, y medir a
    ; otro rate cambia tanto la ponderacion como el aliasado.
    -D SAMPLE_RATE=48000
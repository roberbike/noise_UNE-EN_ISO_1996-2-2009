; Nodo acústico C3 (MAX4466, ADC) — firmware original
[env:lolin_c3_mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = +<*> -<main_i2s.cpp> -<MIC_I2S.cpp>
lib_deps =
    # No external libs needed for basic I2C and ADC

; Nodo acústico S3 (ICS-43434, I2S digital) — Seeed XIAO ESP32-S3
[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = +<*> -<main.cpp>
build_flags =
    ; Core Arduino 3.x / IDF 5.x: driver/i2s.h y dma_buf_count/dma_buf_len
    ; estan marcados como obsoletos. Son avisos, no errores; la API legacy
    ; mantiene compatibilidad con cores 2.x.
    -D I2S_SUPPRESS_DEPRECATE_WARN=1
    -Wno-deprecated-declarations
    ; --- Rama 48khz: muestreo a 48 kHz en el nodo digital ---
    ; El ICS-43434 soporta hasta 51.6 kHz; el S3 (FPU + doble nucleo) procesa
    ; el triple de muestras sin apuros. Da margen de banda hasta 20 kHz
    ; (cabecera hacia Clase 1) y mejor rechazo de alias. Coeficientes de
    ; ponderacion A a 48 kHz en DSP_Engine.cpp (verificados vs IEC 61672-1).
    -D SAMPLE_RATE=48000
    ; Ajuste fino opcional tras contrastar con sonómetro de referencia:
    ; -D MIC_OFFSET_DB=0.0f
    ; Pines I2S alternativos:
    ; -D MIC_I2S_BCLK=2 -D MIC_I2S_WS=3 -D MIC_I2S_DIN=4
lib_deps =
    # No external libs needed for I2S and I2C

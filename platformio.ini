; Noise monitor nodes (UNE-EN ISO 1996-2 / Decreto 213/2012).
; Both firmwares share src/; each environment builds one of the two mains.
; They build on the Arduino core 2.0.x (IDF 4.4) that the PlatformIO
; espressif32 platform ships, and on Arduino core 3.x (IDF 5).

; Acoustic node C3 (MAX4466, ADC)
[env:lolin_c3_mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = +<*> -<main_i2s.cpp> -<MIC_I2S.cpp>
; Calibration of this module: measure it with examples/calibration and a
; 94 dB / 1 kHz calibrator, then set it here (docs/CALIBRACION.md).
; build_flags =
;     -D CALIBRATION_RMS_MV=166.0
lib_deps =
    # No external libs needed for basic I2C and ADC

; Acoustic node S3 (ICS-43434, digital I2S) — Seeed XIAO ESP32-S3
[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = +<*> -<main.cpp>
build_flags =
    ; The legacy I2S driver (driver/i2s.h) is deprecated on core 3.x / IDF 5:
    ; the first flag silences its #warning, the second the deprecated
    ; dma_buf_count/dma_buf_len fields. On core 2.0.x neither has anything to do.
    -D CONFIG_I2S_SUPPRESS_DEPRECATE_WARN=1
    -Wno-deprecated-declarations
    ; 48 kHz on the digital node (the ICS-43434 supports up to 51.6 kHz).
    ; Selects the 48 kHz A- and C-weighting coefficients in DSP_Engine.cpp
    ; and moves Nyquist from 8 to 24 kHz. See docs/RAMA_48KHZ.md.
    -D SAMPLE_RATE=48000
    ; L10/L90 sliding window in seconds (default 300 = 5 min, the usual short
    ; reference interval for urban noise in ISO 1996-2).
    -D AGG_WINDOW_SEC=600
    ; Level trim for the ICS-43434 units of this project, which read ~13.8 dB
    ; hotter than the datasheet sensitivity; -13.71 brings the total conversion
    ; back to K = 15.30 dB. Verified with a 94 dB calibrator and against a
    ; reference sound level meter. Derivation, history and how to check a
    ; unit: docs/CALIBRACION.md. Adjust a single unit with CMD_SET_CALIB
    ; (stored in NVS), not here.
    -D MIC_OFFSET_DB=-13.71
    ; I2S pins (defaults shown: XIAO D1, D2, D3)
    ; -D MIC_I2S_BCLK=2 -D MIC_I2S_WS=3 -D MIC_I2S_DIN=4
lib_deps =
    # No external libs needed for I2S and I2C

; Acoustic node C3 (MAX4466, ADC) — original firmware
[env:lolin_c3_mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = +<*> -<main_i2s.cpp> -<MIC_I2S.cpp>
lib_deps =
    # No external libs needed for basic I2C and ADC

; Acoustic node S3 (ICS-43434, digital I2S) — Seeed XIAO ESP32-S3
[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = +<*> -<main.cpp>
build_flags =
    ; Core Arduino 3.x / IDF 5.x: driver/i2s.h and dma_buf_count/dma_buf_len
    ; are marked as deprecated. These are warnings, not errors.
    ; NOTE (#C1): this project REQUIRES Arduino core 3.x / IDF >= 5.0.
    ; ADC_ATTEN_DB_12 only exists from IDF 5.0 on (IDF 4.4 spells it
    ; ADC_ATTEN_DB_11), so the C3 environment does NOT build with core 2.x.
    ; The earlier claim of 2.x compatibility was wrong.
    -D I2S_SUPPRESS_DEPRECATE_WARN=1
    -Wno-deprecated-declarations
    ; --- 48 kHz branch: sampling at 48 kHz on the digital node ---
    ; The ICS-43434 supports up to 51.6 kHz; the S3 (FPU + dual core) processes
    ; triple the samples without strain. It leaves headroom up to 20 kHz
    ; (toward Class 1) and improves alias rejection. A-weighting coefficients at
    ; 48 kHz in DSP_Engine.cpp (validated against IEC 61672-1).
    -D SAMPLE_RATE=48000
    ; --- Ventana deslizante L10/L90 ---
    ; Longitud en segundos del percentil deslizante (por defecto 300 s = 5 min,
    ; intervalo de referencia corto habitual en ISO 1996-2 urbano). El maestro
    ; recibe siempre el L10/L90 de los ultimos AGG_WINDOW_SEC segundos hasta su
    ; lectura, independientemente de su periodo de sondeo (stime).
    ; -D AGG_WINDOW_SEC=600
    ; --- Calibracion del nodo digital ---
    ; Este valor reproduce EXACTAMENTE el total de la 3.3.0, que es la unica
    ; configuracion verificada contra calibrador: v3.3.0 con el -10.7 que
    ; traia de serie marca 93.8-94.0 dB con un calibrador de 94.0.
    ;   K = -MIC_SENSITIVITY_DBFS + MIC_PEAK_TO_RMS_DB + MIC_OFFSET_DB
    ;   3.3.0        : 26 - 10.70            = +15.3000   <- verificado
    ;   esta version : 26 + 3.0103 - 13.71   = +15.3003
    ; La condicion es sobre K, no sobre este valor suelto: si algun dia se
    ; retira el termino pico->RMS (#A2), el trim pasa a -10.70.
    ;
    ; Por que no es 0: con el trim a 0 (K = +29.01) el calibrador marca 106.5,
    ; es decir 12.6 dB alto. Estos micros entregan mucho mas nivel del que
    ; implica su hoja de datos: a 94 dB SPL dan del orden de -15 dBFS de RMS
    ; frente a los -29.01 que saldrian de la sensibilidad de -26 dBFS
    ; especificada sobre el PICO de la senoide. El motivo de fondo sigue sin
    ; explicar y hay que medirlo, no suponerlo.
    ;
    ; HISTORIA, tres valores equivocados antes de este, para no repetirlos:
    ;  - 0      : de la conjetura de que el -10.7 compensaba el error de 3 dB
    ;             de #A2 y sobraba al arreglarlo. La aritmetica nunca lo
    ;             sostuvo (10.7 no es una compensacion de 3.01) y el
    ;             calibrador marco 106.5.
    ;  - -15.55 : de tomar al pie de la letra un print de RMS de -13.46 dBFS.
    ;             Se pasa 1.8 dB respecto a la configuracion verificada.
    ;  - -10.7  : correcto para la formula SIN el termino #A2, no con el.
    ;
    ; No es un fallo de firmware. Comprobado en las dos versiones ejecutando
    ; el propio DSP_ApplyFilter del repositorio: 0.000 dB de ganancia a 1 kHz
    ; en ambas (16 y 48 kHz), +-0.54 dB hasta 8 kHz frente a IEC 61672-1,
    ; normalizacion s24/2^23, mean_sq = sum_sq/samples y begin() identico. La
    ; unica diferencia de nivel entre 3.3.0 y 3.3.1 son los +3.0103 dB de #A2.
    ;
    ; Para ajustar una unidad concreta usa CMD_SET_CALIB (0x0A), que lo guarda
    ; en NVS y no obliga a reflashear; esto es el trim comun del modelo.
    -D MIC_OFFSET_DB=-13.71
    ; Alternative I2S pins:
    ; -D MIC_I2S_BCLK=2 -D MIC_I2S_WS=3 -D MIC_I2S_DIN=4
lib_deps =
    # No external libs needed for I2S and I2C